<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE6D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ritmo</title>
<meta name="description" content="Organize sua rotina: tarefas, hábitos, foco e muito mais.">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta Ritmo
     #102A24 floresta: texto principal (claro) / fundo (escuro)
     #2F5D50 verde: cor de ação (botões, seleções, progresso, concluído)
     #9E8B5A ouro: destaques e recompensas (sol, prioridades, sequências, XP)
     #EFE6D6 creme: fundo (claro) / texto principal (escuro)
     #3A2F2A terra: neutro quente (texto secundário, vaso, terra, avisos) */
  --forest:#102A24; --green:#2F5D50; --gold:#9E8B5A; --cream:#EFE6D6; --earth:#3A2F2A;
  --bg:var(--cream); --surface:#F8F3EA; --sunken:#E4D9C5; --ink:var(--forest); --muted:#6B5D52; --line:#D8CBB4;
  --accent:var(--green); --accent-text:var(--green); --on-accent:var(--cream);
  --sun:var(--gold); --good:var(--green); --danger:#9C3D2E;
  --toast:var(--earth); --on-toast:var(--cream); --strong:var(--earth);
  --soil:#2A211D; --pot:var(--earth); --leaf1:#2F5D50; --leaf2:#3F7A68; --leaf3:#4E8A74;
  --shadow:0 10px 30px rgba(58,47,42,.16);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:var(--forest); --surface:#163630; --sunken:#1E433A; --ink:var(--cream); --muted:#B3A994; --line:#2B4C43;
    --accent-text:var(--gold); --good:#3F7A68; --danger:#D9826F;
    --toast:var(--cream); --on-toast:var(--forest); --strong:var(--cream);
    --soil:#1B1512; --pot:var(--earth); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:var(--forest); --surface:#163630; --sunken:#1E433A; --ink:var(--cream); --muted:#B3A994; --line:#2B4C43;
  --accent-text:var(--gold); --good:#3F7A68; --danger:#D9826F;
  --toast:var(--cream); --on-toast:var(--forest); --strong:var(--cream);
  --soil:#1B1512; --pot:var(--earth); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;appearance:none;-webkit-appearance:none}
textarea{resize:vertical;min-height:84px;line-height:1.45}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=number]{-moz-appearance:textfield}
img,svg{max-width:100%}

#view{max-width:560px;margin:0 auto;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.date{color:var(--muted);font-size:14px;font-weight:500;text-transform:lowercase}
h1{font:700 30px/1.08 var(--display);letter-spacing:-.015em;margin:2px 0 0}
h2{font:680 19px/1.2 var(--display);letter-spacing:-.005em;margin:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px;gap:10px}
.sec .link{color:var(--accent-text);font-weight:600;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pagehead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.backbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.card + .card{margin-top:10px}
.stack > * + *{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:600;background:var(--sunken);min-height:46px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);background:transparent;border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);font-size:18px;font-weight:700;flex:none}

/* Hero: arco do dia */
.hero{position:relative;margin:6px -4px 0}
.hero svg{display:block;width:100%;height:auto}
.hero .count{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.hero .big{font:760 46px/1 var(--display);letter-spacing:-.03em}
.hero .big span{color:var(--muted);font-weight:600}
.hero .big b{font-weight:inherit}
.hero .mk{transition:opacity .35s}
.hero .lbl{font-size:13px;color:var(--muted);margin-top:4px}

.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);margin-top:10px;width:100%;text-align:left}
.banner .em{font-size:22px}
.banner b{display:block;font-weight:650}
.banner span{font-size:13px;color:var(--muted)}

.energy{margin-top:18px}
.energy .q{font-size:14px;color:var(--muted);margin-bottom:8px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tool{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:600;font-size:14px;line-height:1.2}
.tool .em{font-size:20px}
.tool.on{background:var(--strong);color:var(--bg);border-color:var(--strong)}
.calm{margin-top:12px;padding:12px 14px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:14px}

/* Top 3 */
.top3{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.slot .n{font:760 22px/1 var(--display);color:var(--sun);width:22px;text-align:center;flex:none}
.slot.empty{border-style:dashed;color:var(--muted)}
.slot.done .t{text-decoration:line-through;color:var(--muted)}

/* Tarefas */
.group-l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 2px}
.group-l::after{content:"";flex:1;height:1px;background:var(--line)}
.group-l.late{color:var(--danger)}
.task{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--accent));display:grid;place-items:center;color:var(--on-accent);transition:background .15s}
.check svg{opacity:0;width:14px;height:14px;transition:opacity .15s}
.task.done .check,.check.on{background:var(--c,var(--accent))}
.task.done .check svg,.check.on svg{opacity:1}
.tbody{min-width:0;text-align:left;width:100%}
.tt{font-weight:550;overflow-wrap:anywhere}
.task.done .tt{color:var(--muted)}
.tt span{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.6px;transition:background-size .38s cubic-bezier(.4,0,.2,1) .08s,color .3s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.task.done .tt span{background-size:100% 1.6px}
.tm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:2px}
.tm .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:0}
.tm .late{color:var(--danger)}
.star{color:var(--sun);font-size:16px}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2px 14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;font-size:14px}
.empty .em{font-size:30px;display:block;margin-bottom:6px}

.seg{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;margin-left:4px}

/* Hábitos */
.hpills{display:flex;flex-wrap:wrap;gap:8px}
.hpill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.hpill.on{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:var(--good)}
.hpill .em{font-size:18px}
.habit .head{display:flex;align-items:center;gap:12px}
.habit .em{font-size:26px;width:36px;text-align:center}
.habit .name{font-weight:650}
.streak{font-size:13px;color:var(--muted)}
.streak b{color:var(--sun)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;font-style:normal;font-size:13px;color:transparent}
.wd.on i{background:var(--good);color:var(--on-accent)}
.wd.off i{background:transparent;border:1px dashed var(--line)}
.wd.today span{color:var(--ink);font-weight:700}
.hm-wrap{overflow-x:auto;margin-top:14px;padding-bottom:4px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;width:max-content}
.hm i{border-radius:3px;background:var(--sunken)}
.hm i.on{background:var(--good)}
.hm i.off{background:transparent}
.hm i.fut{background:transparent}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--bg);border-radius:12px;padding:10px}
.kv b{display:block;font:720 20px/1.1 var(--display)}
.kv span{font-size:12px;color:var(--muted)}

/* Contadores */
.counter{display:flex;align-items:center;gap:12px}
.counter .em{font-size:24px;width:32px;text-align:center}
.bar{height:6px;border-radius:9px;background:var(--sunken);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.bar.good i{background:var(--good)}
.cval{font:700 17px/1 var(--display);min-width:54px;text-align:center}

/* Foco */
.timer{display:grid;place-items:center;margin:14px auto 8px;position:relative;width:min(290px,78vw);aspect-ratio:1}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .tx{text-align:center}
.timer .tx b{display:block;font:760 58px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer .tx span{color:var(--muted);font-size:14px}

/* Mais */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile .em{font-size:26px}
.tile b{display:block;font-weight:650;margin-top:8px}
.tile span{font-size:12.5px;color:var(--muted)}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.cday{aspect-ratio:1/1.12;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-size:14px;font-weight:600;position:relative}
.cday.other{opacity:.35}
.cday.today{border:2px solid var(--accent)}
.cday .dots{display:flex;gap:2px}
.cday .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cday .mood{font-size:11px;line-height:1}
.cday .hb{position:absolute;left:6px;right:6px;bottom:5px;height:3px;border-radius:3px;background:var(--sunken);overflow:hidden}
.cday .hb i{display:block;height:100%;background:var(--good)}

/* Metas */
.goal .head{display:flex;align-items:center;gap:12px}
.goal .em{font-size:26px}
.pct{font:720 16px/1 var(--display)}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,13,22,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.in{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin-bottom:14px}
.field{margin-top:14px}
.field > label,.flabel{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;width:100%;text-align:left}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(18px)}
.subrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.subrow .check{width:22px;height:22px}
.x{color:var(--muted);font-size:20px;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;flex:none}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;background:var(--bg);font-size:22px;border:1px solid transparent}
.emojis button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:40px;border-radius:12px;background:var(--bg);font-weight:700;border:1px solid var(--line)}
.days button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moods button{font-size:30px;height:58px;border-radius:14px;background:var(--bg);border:2px solid transparent}
.moods button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.run{text-align:center;padding:10px 0 4px}
.run .step{font:700 26px/1.2 var(--display);margin:16px 0 6px}
.run .clock{font:760 54px/1 var(--display);font-variant-numeric:tabular-nums;margin:18px 0}
.progress-dots{display:flex;gap:6px;justify-content:center}
.progress-dots i{width:24px;height:5px;border-radius:5px;background:var(--line)}
.progress-dots i.on{background:var(--accent)}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.pick .check{width:24px;height:24px}

/* Planta */
.plant{display:grid;place-items:center;padding:6px 0}
.plant svg{width:min(260px,70vw);height:auto}
.plant.grow svg{animation:grow .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes grow{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.xpbar{height:10px;border-radius:9px;background:var(--sunken);overflow:hidden;margin:8px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.lvchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-size:13px;font-weight:700;flex:none}

/* Conquistas */
.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.ach .em{font-size:32px;display:block}
.ach b{display:block;font-size:14px;margin-top:6px}
.ach span{font-size:12px;color:var(--muted)}
.ach .lock{opacity:.45;filter:grayscale(1)}

/* Estatísticas */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:760 28px/1 var(--display);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 2fr 42px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insight{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));font-size:14px;margin-top:10px}

.entry{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;width:100%;text-align:left}
.entry:last-child{border-bottom:0}
.entry .d{font:700 13px/1.3 var(--display);color:var(--muted);width:52px;flex:none;text-transform:lowercase}

/* Barra de abas */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}

<script>
"use strict";
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey();
const DOW = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const DOW_S = ["D", "S", "T", "Q", "Q", "S", "S"];
const MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const fmtLong = k => { const d = parseKey(k); return `${DOW[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const fmtShort = k => { const d = parseKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const weekStart = k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dkey(d); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const ENERGY = { alta: { em: "⚡", name: "Alta" }, media: { em: "🔋", name: "Média" }, baixa: { em: "🪫", name: "Baixa" } };
const PRIO = { 1: "Alta", 2: "Média", 3: "Baixa" };
const MOODS = ["😞", "😕", "😐", "🙂", "😄"];
const PALETTE = ["#2F5D50", "#9E8B5A", "#6E7F4E", "#4F7F8C", "#A0584A", "#7A5C4B", "#8C6A8A", "#5E6B66"];
const OLD_AREA = { "#5B4BFF": "#2F5D50", "#E8900C": "#9E8B5A", "#1FA971": "#6E7F4E", "#0E8AA8": "#4F7F8C", "#E0457B": "#A0584A", "#8B5CF6": "#8C6A8A", "#C2410C": "#7A5C4B", "#64748B": "#5E6B66" };
const EMOJIS = ["💧", "🏃", "📚", "🧘", "🥗", "💊", "🛏️", "✍️", "🎸", "🧹", "💰", "🙏", "🌿", "☀️", "🌙", "🦷", "🚶", "💪", "🎯", "🧠", "📵", "🍎", "☕", "🐶"];
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

/* ============ Estado ============ */
function defaultState() {
  return {
    v: 1, updatedAt: 0,
    settings: { name: "", theme: "auto", pomo: { work: 25, short: 5, long: 15 }, notif: {} },
    areas: [
      { id: "trabalho", name: "Trabalho", color: "#2F5D50" },
      { id: "casa", name: "Casa", color: "#9E8B5A" },
      { id: "saude", name: "Saúde", color: "#6E7F4E" },
      { id: "estudos", name: "Estudos", color: "#4F7F8C" },
      { id: "pessoal", name: "Pessoal", color: "#A0584A" }
    ],
    tasks: [], inbox: [], top3: {}, hardDay: {}, checkins: {}, habits: [],
    routines: [
      { id: uid(), name: "Rotina da manhã", emoji: "☀️", steps: [
        { id: uid(), t: "Beber um copo de água", min: 1 },
        { id: uid(), t: "Alongar o corpo", min: 5 },
        { id: uid(), t: "Olhar o dia e escolher as 3 prioridades", min: 3 }] },
      { id: uid(), name: "Rotina da noite", emoji: "🌙", steps: [
        { id: uid(), t: "Separar o que vou usar amanhã", min: 5 },
        { id: uid(), t: "Escrever a linha do diário", min: 2 },
        { id: uid(), t: "Deixar o celular longe da cama", min: 1 }] }
    ],
    routineRuns: {},
    counters: [
      { id: "agua", name: "Água", emoji: "💧", goal: 8, unit: "copos", step: 1 },
      { id: "sono", name: "Sono", emoji: "😴", goal: 8, unit: "h", step: 0.5 }
    ],
    counterLog: {}, focus: [], goals: [], journal: {}, reviews: [],
    stats: { inboxProcessed: 0, hardDays: 0 }
  };
}
function migrate(s) {
  const d = defaultState();
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  s.settings = { ...d.settings, ...s.settings };
  s.settings.pomo = { ...d.settings.pomo, ...(s.settings.pomo || {}) };
  s.stats = { ...d.stats, ...s.stats };
  (s.areas || []).forEach(a => { if (OLD_AREA[a.color]) a.color = OLD_AREA[a.color]; });
  delete s.settings.accent;
  return s;
}
const LS = "ritmo.v1";
function load() {
  try { const raw = localStorage.getItem(LS); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return defaultState();
}
let S = load();
function save(quiet) {
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  scheduleCloud();
  if (!quiet) scheduleRewards();
}

/* ============ Sincronização com a conta (quando disponível) ============ */
const cloud = { ref: null, timer: null, chain: Promise.resolve() };
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/ritmo");
    const snap = await ref.get();
    cloud.ref = ref;
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.json && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
      S = migrate(JSON.parse(remote.json)); syncSeen();
      try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
      applyTheme(); render();
    } else if (S.updatedAt && (!remote || (S.updatedAt || 0) > (remote.updatedAt || 0))) {
      pushCloud();
    }
    if (route.page === "ajustes") render();
  } catch (e) { cloud.ref = null; }
}
function scheduleCloud() {
  if (!cloud.ref) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(pushCloud, 1500);
}
function pushCloud() {
  if (!cloud.ref) return;
  clearTimeout(cloud.timer);
  const payload = { json: JSON.stringify(S), updatedAt: S.updatedAt };
  cloud.chain = cloud.chain.then(() => cloud.ref.set(payload)).catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") pushCloud(); });

/* ============ Tema ============ */
function applyTheme() {
  const r = document.documentElement;
  if (S.settings.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.settings.theme);
  const dark = S.settings.theme === "dark" || (S.settings.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", dark ? "#102A24" : "#EFE6D6");
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {}

/* ============ Consultas ============ */
const area = id => S.areas.find(a => a.id === id) || { id: "", name: "Sem área", color: "#8A93A6" };
const taskById = id => S.tasks.find(t => t.id === id);
const sortTasks = (a, b) => (a.time || "99") .localeCompare(b.time || "99") || (a.prio || 2) - (b.prio || 2) || (a.createdAt || 0) - (b.createdAt || 0);
function top3Of(k) { return (S.top3[k] || []).map(taskById).filter(Boolean); }
function habitDue(h, k) { return (h.days || [0,1,2,3,4,5,6]).includes(parseKey(k).getDay()); }
function streak(h) {
  let k = today(), n = 0;
  if (!h.log[k]) k = addDays(k, -1);
  const start = h.createdAt || "2000-01-01";
  for (let i = 0; i < 2000 && k >= start; i++) {
    if (habitDue(h, k)) { if (h.log[k]) n++; else break; }
    k = addDays(k, -1);
  }
  return n;
}
function bestStreak(h) {
  let k = h.createdAt || today(), best = 0, cur = 0; const end = today();
  const first = Object.keys(h.log).sort()[0];
  if (first && first < k) k = first;
  for (let i = 0; i < 4000 && k <= end; i++) {
    if (habitDue(h, k)) { if (h.log[k]) { cur++; best = Math.max(best, cur); } else if (k !== end) cur = 0; }
    k = addDays(k, 1);
  }
  return best;
}
function habitRate(h, days) {
  let due = 0, done = 0, k = today();
  for (let i = 0; i < days; i++) {
    if (k < (h.createdAt || "2000-01-01")) break;
    if (habitDue(h, k)) { due++; if (h.log[k]) done++; }
    k = addDays(k, -1);
  }
  return due ? done / due : 0;
}
function counterVal(id, k = today()) { return ((S.counterLog[k] || {})[id]) || 0; }
function isGoalDone(g) {
  if (g.type === "num") return g.target > 0 && g.current >= g.target;
  return (g.steps || []).length > 0 && g.steps.every(s => s.done);
}
function goalPct(g) {
  if (g.type === "num") return g.target > 0 ? clamp(g.current / g.target, 0, 1) : 0;
  const s = g.steps || []; return s.length ? s.filter(x => x.done).length / s.length : 0;
}
function focusMin(k) { return S.focus.filter(f => f.date === k).reduce((a, f) => a + f.min, 0); }
function doneOn(k) { return S.tasks.filter(t => t.done && t.doneAt && dkey(new Date(t.doneAt)) === k).length; }

/* ============ XP e planta ============ */
function xp() {
  const t = S.tasks.filter(x => x.done).length * 10;
  const h = S.habits.reduce((a, h) => a + Object.keys(h.log || {}).length, 0) * 5;
  const f = S.focus.length * 15;
  const c = Object.values(S.checkins).reduce((a, c) => a + (c.am ? 1 : 0) + (c.pm ? 1 : 0), 0) * 5;
  const r = S.reviews.length * 30;
  const j = Object.values(S.journal).filter(Boolean).length * 5;
  const rr = Object.values(S.routineRuns).reduce((a, v) => a + v.length, 0) * 10;
  const g = S.goals.filter(isGoalDone).length * 50;
  return t + h + f + c + r + j + rr + g;
}
function levelInfo(x = xp()) {
  let lvl = 1, need = 50, base = 0;
  while (x >= base + need) { base += need; lvl++; need = 50 * lvl; }
  return { lvl, into: x - base, need };
}
const PLANT_NAMES = ["Semente", "Broto", "Mudinha", "Plantinha", "Arbusto", "Botões", "Primeira flor", "Florida", "Exuberante", "Árvore"];
const plantName = l => PLANT_NAMES[Math.min(l, 10) - 1];
let lastLevel = levelInfo().lvl;
function checkLevelUp() { scheduleRewards(); }
let plantGrew = false;

function plantSVG(lvl, size = 200) {
  const cx = 100, soil = 168;
  let g = "";
  const stemH = lvl <= 1 ? 0 : Math.min(18 + lvl * 13, 132);
  const topY = soil - stemH;
  if (lvl <= 1) {
    g += `<g class="lf" style="--i:0;transform-origin:${cx}px ${soil}px"><ellipse cx="${cx}" cy="${soil - 3}" rx="9" ry="6" fill="var(--gold)"/><path d="M${cx} ${soil - 8} q2 -6 6 -8" stroke="var(--good)" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
  } else {
    const sway = lvl >= 10 ? 0 : 6;
    g += `<path class="stem" d="M${cx} ${soil} C ${cx - sway} ${soil - stemH * 0.4}, ${cx + sway} ${soil - stemH * 0.7}, ${cx} ${topY}" stroke="var(--leaf1)" stroke-width="${lvl >= 10 ? 8 : 4}" fill="none" stroke-linecap="round"/>`;
    const leaves = Math.min(lvl * 2 - 2, 14);
    for (let i = 0; i < leaves; i++) {
      const t = (i + 1) / (leaves + 1);
      const y = soil - stemH * t * 0.95;
      const side = i % 2 ? 1 : -1;
      const len = 14 + Math.min(lvl, 8) * 2 - t * 6;
      const rot = side * (38 + t * 12);
      g += `<g class="lf" style="--i:${i};transform-origin:${cx}px ${(y - 2).toFixed(1)}px"><ellipse cx="${cx + side * len * 0.6}" cy="${y - 4}" rx="${len * 0.62}" ry="${len * 0.3}" fill="${i % 3 === 0 ? "var(--leaf3)" : "var(--leaf2)"}" transform="rotate(${rot} ${cx + side * len * 0.6} ${y - 4})"/></g>`;
    }
    if (lvl >= 10) {
      g += `<g class="lf" style="--i:14;transform-origin:${cx}px ${topY + 40}px"><circle cx="${cx}" cy="${topY + 4}" r="44" fill="var(--leaf2)"/><circle cx="${cx - 30}" cy="${topY + 22}" r="28" fill="var(--leaf3)"/><circle cx="${cx + 30}" cy="${topY + 20}" r="30" fill="var(--leaf1)"/><circle cx="${cx + 4}" cy="${topY - 20}" r="26" fill="var(--leaf3)"/></g>`;
    }
    if (lvl >= 6) {
      const n = Math.min(lvl - 5, 6);
      const spots = [[0, 0], [-26, 26], [26, 30], [-18, 58], [22, 64], [0, 40]];
      for (let i = 0; i < n; i++) {
        const [dx, dy] = spots[i];
        const fx = cx + dx, fy = topY + dy - (lvl >= 10 ? 14 : 0);
        const open = lvl >= 7 || i > 0 ? 1 : 0;
        g += `<g class="lf" style="--i:${16 + i};transform-origin:${fx}px ${fy}px">`;
        if (!open) { g += `<ellipse cx="${fx}" cy="${fy}" rx="5" ry="8" fill="var(--gold)"/></g>`; continue; }
        for (let p = 0; p < 5; p++) {
          const a = (p / 5) * Math.PI * 2;
          g += `<circle cx="${(fx + Math.cos(a) * 7).toFixed(1)}" cy="${(fy + Math.sin(a) * 7).toFixed(1)}" r="6" fill="${i % 2 ? "#C9B888" : "var(--gold)"}"/>`;
        }
        g += `<circle cx="${fx}" cy="${fy}" r="4.5" fill="var(--earth)"/></g>`;
      }
    }
  }
  const pot = `<path d="M52 170 H148 L138 214 H62 Z" fill="var(--pot)"/><rect x="46" y="160" width="108" height="16" rx="6" fill="var(--pot)"/><rect x="46" y="160" width="108" height="16" rx="6" fill="var(--gold)" opacity=".35"/><ellipse cx="100" cy="163" rx="48" ry="5" fill="var(--soil)"/>`;
  return `<svg viewBox="0 0 200 220" width="${size}" role="img" aria-label="Planta no nível ${lvl}"><g class="sw-g">${g}</g>${pot}</svg>`;
}

let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}
let D = null;            // rascunho da sheet aberta
let sheetFn = null;      // função que desenha a sheet
let sheetTok = 0;
function openSheet(fn, draft) {
  D = draft || {}; sheetFn = fn; sheetTok++;
  const root = $("#sheet-root");
  root.classList.remove("closing"); root.style.pointerEvents = "";
  root.innerHTML = `<div class="backdrop" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-body">${fn()}</div></div>`;
  root.classList.add("open");
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => { const s = root.querySelector(".sheet"); s && s.classList.add("in"); }));
}
function refreshSheet() {
  const b = $("#sheet-root .sheet-body"); if (!b || !sheetFn) return;
  const sh = $("#sheet-root .sheet"); const st = sh.scrollTop;
  b.innerHTML = sheetFn(); sh.scrollTop = st;
}
function closeSheet() {
  const root = $("#sheet-root");
  document.body.style.overflow = "";
  const onClose = D && D.onClose; D = null; sheetFn = null;
  if (root.classList.contains("open")) {
    const tok = ++sheetTok;
    const done = () => { if (tok === sheetTok) { root.classList.remove("open", "closing"); root.innerHTML = ""; root.style.pointerEvents = ""; } };
    if (RM()) done();
    else { root.classList.add("closing"); root.style.pointerEvents = "none"; const s = root.querySelector(".sheet"); s && s.classList.remove("in"); setTimeout(done, 240); }
  }
  onClose && onClose();
}
function setPath(obj, path, val) {
  const ks = path.split("."); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}

/* ============ Som ============ */
let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function beep() {
  try {
    unlockAudio(); if (!actx) return;
    [0, 0.28, 0.56].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = [660, 880, 990][i];
      g.gain.setValueAtTime(0.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.24);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.26);
    });
  } catch (e) {}
}

function taskRow(t, opt = {}) {
  const a = area(t.area); const k = today();
  const subs = t.subtasks || []; const sd = subs.filter(s => s.done).length;
  const meta = [];
  if (opt.showDate && t.date) meta.push(`<span class="${!t.done && t.date < k ? "late" : ""}">${t.date === k ? "Hoje" : t.date === addDays(k, 1) ? "Amanhã" : fmtShort(t.date)}</span>`);
  if (t.time) meta.push(`<span>${t.time}</span>`);
  if (t.area) meta.push(`<span style="--c:${a.color}"><i class="dot"></i>${esc(a.name)}</span>`);
  if (t.energy) meta.push(`<span>${ENERGY[t.energy].em} ${ENERGY[t.energy].name}</span>`);
  if (subs.length) meta.push(`<span>${sd}/${subs.length} etapas</span>`);
  const isTop = (S.top3[k] || []).includes(t.id);
  return `<div class="task ${t.done ? "done" : ""}" data-fid="${t.id}">
    <button class="check" style="--c:${a.color}" data-a="toggleTask" data-id="${t.id}" aria-label="${t.done ? "Desmarcar" : "Concluir"} ${esc(t.title)}">${CHECK}</button>
    <button class="tbody" data-a="editTask" data-id="${t.id}"><div class="tt"><span>${esc(t.title)}</span></div>${meta.length ? `<div class="tm">${meta.join("")}</div>` : ""}</button>
    ${isTop ? '<span class="star" title="Prioridade do dia">★</span>' : "<span></span>"}
  </div>`;
}
function energyMatch(t, e) {
  if (!e || e === "alta") return true;
  const te = t.energy || "media";
  if (e === "media") return te !== "alta";
  return te === "baixa";
}

const ARC = { cx: 160, cy: 150, r: 128, H0: 5, H1: 24 };
function arcPt(h, rr = ARC.r) { const f = clamp((h - ARC.H0) / (ARC.H1 - ARC.H0), 0, 1); const a = Math.PI * (1 - f); return [ARC.cx + rr * Math.cos(a), ARC.cy - rr * Math.sin(a)]; }
function arcD(x, y) { return `M${ARC.cx - ARC.r} ${ARC.cy} A ${ARC.r} ${ARC.r} 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}`; }
const nowH = () => { const n = new Date(); return n.getHours() + n.getMinutes() / 60; };
function dayArc(k) {
  const { cx, cy, r, H0 } = ARC;
  const h = nowH(); const [nx, ny] = arcPt(h);
  let marks = "";
  S.tasks.filter(t => t.date === k && t.time).forEach(t => {
    const [hh, mm] = t.time.split(":").map(Number); const th = hh + mm / 60; const [x, y] = arcPt(th);
    const c = area(t.area).color;
    marks += `<circle class="mk" data-h="${th.toFixed(2)}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${t.done ? c : "var(--surface)"}" stroke="${c}" stroke-width="2.5"/>`;
  });
  const lbl = (hr, txt) => { const [x, y] = arcPt(hr, r + 18); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)" font-family="Figtree, sans-serif">${txt}</text>`; };
  return `<svg viewBox="0 0 320 172" aria-hidden="true">
    <path d="M${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" stroke="var(--sunken)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path id="arcEl" d="${h > H0 ? arcD(nx, ny) : ""}" stroke="var(--accent)" stroke-width="10" fill="none" stroke-linecap="round" opacity=".9"/>
    ${marks}
    <circle id="sunGlow" class="breath" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="17" fill="var(--sun)" opacity=".22"/>
    <circle id="sunDot" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="10" fill="var(--sun)" stroke="var(--surface)" stroke-width="3"/>
    ${lbl(6, "6h")}${lbl(12, "12h")}${lbl(18, "18h")}
  </svg>`;
}

/* ============ HOJE ============ */
function greeting() { const h = new Date().getHours(); return h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
function reviewWeekFor(k) { const d = parseKey(k).getDay(); return d === 1 ? weekStart(addDays(k, -1)) : weekStart(k); }

function vHoje() {
  const k = today(); const hour = new Date().getHours();
  const hard = !!S.hardDay[k]; const e = route.energy;
  const todayTasks = S.tasks.filter(t => t.date === k);
  const doneCount = todayTasks.filter(t => t.done).length;
  const lv = levelInfo();
  const ci = S.checkins[k] || {};
  const top = S.top3[k];
  const topSet = new Set(top || []);

  // avisos
  const banners = [];
  if (!ci.am && hour < 14) banners.push(`<button class="banner" data-a="checkin" data-w="am"><span class="em">🌤️</span><div><b>Como você acordou?</b><span>Check-in da manhã, leva 10 segundos</span></div></button>`);
  if (!ci.pm && hour >= 18) banners.push(`<button class="banner" data-a="checkin" data-w="pm"><span class="em">🌙</span><div><b>Como foi o seu dia?</b><span>Check-in da noite</span></div></button>`);
  const dw = parseKey(k).getDay();
  if ([0, 1, 6].includes(dw) && !S.reviews.some(r => r.week === reviewWeekFor(k))) banners.push(`<button class="banner" data-a="reviewStart"><span class="em">🪞</span><div><b>Hora da revisão semanal</b><span>5 minutos para fechar a semana com clareza</span></div></button>`);
  if (S.inbox.length >= 5) banners.push(`<button class="banner" data-a="goInbox"><span class="em">📥</span><div><b>${S.inbox.length} itens na caixa de entrada</b><span>Toque para organizar</span></div></button>`);

  if (!S.updatedAt) banners.unshift(`<button class="banner" data-a="page" data-p="ajustes"><span class="em">📦</span><div><b>Já usava o Ritmo em outro lugar?</b><span>Restaure seu backup em Ajustes para trazer seus dados</span></div></button>`);
  // tarefas visíveis
  let pend = S.tasks.filter(t => !t.done && t.date && t.date <= k);
  let done = todayTasks.filter(t => t.done);
  if (hard) { pend = pend.filter(t => topSet.has(t.id) || t.essential); done = done.filter(t => topSet.has(t.id) || t.essential); }
  const hiddenByEnergy = pend.filter(t => !energyMatch(t, e)).length;
  pend = pend.filter(t => energyMatch(t, e));
  const groups = [
    ["Atrasadas", t => t.date < k, "late"],
    ["Sem horário", t => t.date === k && !t.time],
    ["Manhã", t => t.date === k && t.time && t.time < "12:00"],
    ["Tarde", t => t.date === k && t.time && t.time >= "12:00" && t.time < "18:00"],
    ["Noite", t => t.date === k && t.time && t.time >= "18:00"]
  ];
  const all = [...pend, ...done];
  let timeline = "";
  groups.forEach(([name, fn, cls]) => {
    const items = all.filter(fn).sort((a, b) => (a.done - b.done) || sortTasks(a, b));
    if (items.length) timeline += `<div class="group-l ${cls || ""}">${name}</div><div>${items.map(t => taskRow(t, { showDate: cls === "late" })).join("")}</div>`;
  });

  // top 3
  const topTasks = top3Of(k);
  let topHtml = "";
  if (!top || !top.length) {
    topHtml = `<button class="slot empty" data-a="top3Open"><span class="n">+</span><span>Escolher as 3 coisas mais importantes de hoje</span></button>`;
  } else {
    for (let i = 0; i < 3; i++) {
      const t = topTasks[i];
      topHtml += t ? `<div class="slot ${t.done ? "done" : ""}"><span class="n">${i + 1}</span><button class="grow t" style="text-align:left" data-a="editTask" data-id="${t.id}">${esc(t.title)}</button><button class="check ${t.done ? "on" : ""}" style="--c:var(--accent)" data-a="toggleTask" data-id="${t.id}" aria-label="Concluir">${CHECK}</button></div>`
        : `<button class="slot empty" data-a="top3Open"><span class="n">${i + 1}</span><span>Adicionar prioridade</span></button>`;
    }
  }

  // hábitos
  const dueH = S.habits.filter(h => habitDue(h, k));
  const habitsHtml = dueH.length ? `<div class="hpills">${dueH.map(h => { const st = h.log[k] ? streak(h) : 0; return `<button class="hpill ${h.log[k] ? "on" : ""}" data-a="habitToggle" data-id="${h.id}" data-d="${k}" data-hid="${h.id}"><span class="em">${h.emoji}</span>${esc(h.name)}${st ? ` <span class="fl">🔥</span><b class="sn">${st}</b>` : ""}</button>`; }).join("")}</div>`
    : `<button class="empty" style="width:100%" data-a="newHabit"><span class="em">🌱</span>Nenhum hábito para hoje. Toque para criar o primeiro.</button>`;

  // contadores
  const countersHtml = S.counters.map(c => {
    const v = counterVal(c.id, k); const p = c.goal ? clamp(v / c.goal, 0, 1) : 0;
    return `<div class="counter"><span class="em">${c.emoji}</span><div class="grow"><div><b>${esc(c.name)}</b> <span class="small muted" style="white-space:nowrap">de ${c.goal} ${esc(c.unit)}</span></div><div class="bar ${p >= 1 ? "good" : ""}"><i data-cbar="${c.id}" style="width:${p * 100}%"></i></div></div>
      <button class="iconbtn" data-a="counter" data-id="${c.id}" data-d="-1" aria-label="Diminuir ${esc(c.name)}">−</button><span class="cval" data-cval="${c.id}">${v}</span><button class="iconbtn" data-a="counter" data-id="${c.id}" data-d="1" aria-label="Aumentar ${esc(c.name)}">+</button></div>`;
  }).join('<div style="height:14px"></div>');

  // rotinas
  const runs = S.routineRuns[k] || [];
  const routinesHtml = S.routines.length ? `<div class="chips wrap">${S.routines.map(r => `<button class="chip ${runs.includes(r.id) ? "on" : ""}" data-a="routineStart" data-id="${r.id}">${r.emoji} ${esc(r.name)}${runs.includes(r.id) ? " ✓" : ""}</button>`).join("")}</div>` : `<p class="muted small">Crie rotinas na aba Hábitos.</p>`;

  const jr = S.journal[k] || "";

  return `
  <div class="top"><div><div class="date">${fmtLong(k)}</div><h1>${greeting()}${S.settings.name ? ", " + esc(S.settings.name) : ""}</h1></div>
    <button class="lvchip" data-a="page" data-p="planta" aria-label="Minha planta, nível ${lv.lvl}">🌱 Nível ${lv.lvl}</button></div>
  <div class="hero">${dayArc(k)}<div class="count"><div class="big"><b id="bigN">${doneCount}</b><span>/${todayTasks.length}</span></div><div class="lbl">${todayTasks.length ? "tarefas de hoje concluídas" : "nenhuma tarefa marcada para hoje"}</div></div></div>
  ${banners.slice(0, 2).join("")}

  <div class="energy"><div class="q">Como está sua energia agora?</div>
    <div class="chips">${Object.entries(ENERGY).map(([id, en]) => `<button class="chip ${e === id ? "on" : ""}" data-a="energy" data-e="${id}">${en.em} ${en.name}</button>`).join("")}</div>
    ${e ? `<p class="small muted" style="margin:8px 0 0">${e === "alta" ? "Energia alta: tudo liberado. Ótima hora para as tarefas pesadas." : e === "media" ? "Mostrando tarefas de energia média e baixa." : "Mostrando só tarefas leves, de energia baixa."}${hiddenByEnergy ? ` ${hiddenByEnergy} ${hiddenByEnergy > 1 ? "tarefas escondidas" : "tarefa escondida"} por enquanto.` : ""}</p>` : ""}
  </div>
  <div class="tools">
    <button class="tool" data-a="random"><span class="em">🎲</span>Não sei o que fazer agora</button>
    <button class="tool ${hard ? "on" : ""}" data-a="hardDay" aria-pressed="${hard}"><span class="em">🫶</span>${hard ? "Dia difícil ligado" : "Estou num dia difícil"}</button>
  </div>
  ${hard ? `<div class="calm">Só o essencial está aparecendo: suas prioridades e tarefas marcadas como essenciais. O resto pode esperar, e está tudo bem.</div>` : ""}

/* ============ HÁBITOS / ROTINAS / CONTADORES ============ */
function heatmap(h) {
  const end = today(); const endD = parseKey(end);
  let start = addDays(end, -(52 * 7 + endD.getDay()));
  let cells = "";
  for (let k = start; k <= addDays(end, 6 - endD.getDay()); k = addDays(k, 1)) {
    const fut = k > end; const pre = k < (h.createdAt || "2000-01-01") && !h.log[k];
    const cls = fut ? "fut" : h.log[k] ? "on" : (!habitDue(h, k) || pre) ? "off" : "";
    cells += `<i class="${cls}" title="${fmtShort(k)}"></i>`;
  }
  return `<div class="hm-wrap"><div class="hm">${cells}</div></div>`;
}

      return `<div class="card habit"><button class="head" style="width:100%;text-align:left" data-a="habitOpen" data-id="${h.id}"><span class="em">${h.emoji}</span><div class="grow"><div class="name">${esc(h.name)}</div><div class="streak" data-hid="${h.id}">${st ? `<span class="fl">🔥</span> <b class="sn">${st}</b> ${st === 1 ? "dia seguido" : "dias seguidos"}` : "Comece hoje a sequência"}</div></div><span class="muted">${open ? "▴" : "▾"}</span></button>
        <div class="week">${week}</div>
        ${open ? `${heatmap(h)}<div class="kv"><div><b>${bestStreak(h)}</b><span>melhor sequência</span></div><div><b>${Math.round(habitRate(h, 30) * 100)}%</b><span>últimos 30 dias</span></div><div><b>${Object.keys(h.log).length}</b><span>vezes no total</span></div></div><button class="btn ghost block" style="margin-top:12px" data-a="editHabit" data-id="${h.id}">Editar hábito</button>` : ""}
      </div>`;

  if (seg === "rotinas") {
    const runs = S.routineRuns[k] || [];
    body = (S.routines.map(r => `<div class="card"><div class="spread"><div class="row"><span style="font-size:26px">${r.emoji}</span><div><b>${esc(r.name)}</b><div class="small muted">${r.steps.length} passos, ${r.steps.reduce((a, s) => a + (+s.min || 0), 0)} min${runs.includes(r.id) ? ", feita hoje ✓" : ""}</div></div></div><button class="x" data-a="editRoutine" data-id="${r.id}" aria-label="Editar rotina">✎</button></div>
      <ol class="small muted" style="margin:10px 0 12px;padding-left:20px">${r.steps.map(s => `<li>${esc(s.t)}</li>`).join("")}</ol>
      <button class="btn primary block" data-a="routineStart" data-id="${r.id}">▶ Começar rotina</button></div>`).join("") || `<div class="empty"><span class="em">🎼</span>Rotinas são sequências de passos que você faz na ordem, com tempo para cada um.</div>`)
      + `<button class="btn ghost block" style="margin-top:14px" data-a="newRoutine">+ Nova rotina</button>`;
  }
  if (seg === "contadores") {
    body = S.counters.map(c => {

      vals.forEach(([d, x], i) => { const hh = mx ? (x / mx) * 44 : 0; bars += `<rect x="${i * 44 + 8}" y="${52 - hh}" width="28" height="${Math.max(hh, 2)}" rx="5" fill="${x >= c.goal ? "var(--good)" : "var(--accent)"}" opacity="${i === 6 ? 1 : .55}"/><text x="${i * 44 + 22}" y="68" text-anchor="middle" font-size="10" fill="var(--muted)">${DOW_S[parseKey(d).getDay()]}</text>`; });

  <div class="stack">${body}</div>`;
}

/* ============ FOCO ============ */
function vFoco() {
  const k = today(); const left = timeLeft(); const total = modeLen(T.mode);
  const C = 2 * Math.PI * 130; const off = C * (1 - left / total);
  const pend = S.tasks.filter(t => !t.done && (!t.date || t.date <= addDays(k, 7))).sort((a, b) => (a.date || "9").localeCompare(b.date || "9") || sortTasks(a, b));
  const sessions = S.focus.filter(f => f.date === k);
  const modes = [["work", "Foco"], ["short", "Pausa curta"], ["long", "Pausa longa"]];
  return `<div class="top"><div><div class="date">${T.mode === "work" ? "modo concentração" : "hora de respirar"}</div><h1>Foco</h1></div></div>
  <div class="chips" style="justify-content:center;margin-top:10px">${modes.map(([m, n]) => `<button class="chip ${T.mode === m ? "on" : ""}" data-a="fMode" data-m="${m}">${n}</button>`).join("")}</div>
  <div class="timer"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="130" stroke="var(--sunken)" stroke-width="14" fill="none"/><circle id="fring" style="--C:${C.toFixed(1)}" cx="150" cy="150" r="130" stroke="${T.mode === "work" ? "var(--accent)" : "var(--good)"}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="tx"><b id="ft">${mmss(left)}</b><span>${T.running ? "em andamento" : left < total ? "pausado" : T.mode === "work" ? `${S.settings.pomo.work} minutos` : "pausa"}</span></div></div>
  <div class="field" style="margin-top:4px"><label for="fTask">Trabalhando em</label><select id="fTask" data-onchange="fTask"><option value="">Nenhuma tarefa específica</option>${pend.map(t => `<option value="${t.id}" ${T.taskId === t.id ? "selected" : ""}>${esc(t.title)}</option>`).join("")}</select></div>
  <div class="actions">${T.running ? `<button class="btn block" data-a="fPause">Pausar</button>` : `<button class="btn primary block" data-a="fStart">${left < total ? "Continuar" : "Começar"}</button>`}<button class="btn ghost" style="flex:0 0 auto" data-a="fReset">Recomeçar</button></div>
  <div class="sec"><h2>Hoje</h2><span class="muted small">${focusMin(k)} min em ${sessions.length} ${sessions.length === 1 ? "sessão" : "sessões"}</span></div>
  ${sessions.length ? `<div class="listcard">${sessions.slice().reverse().map(f => { const t = taskById(f.taskId); const d = new Date(f.at); return `<div class="task" style="grid-template-columns:1fr auto"><div class="tbody"><div class="tt">${t ? esc(t.title) : "Foco livre"}</div><div class="tm">${pad(d.getHours())}:${pad(d.getMinutes())}</div></div><b>${f.min} min</b></div>`; }).join("")}</div>`
    : `<div class="empty"><span class="em">⏱️</span>Escolha uma tarefa e faça ${S.settings.pomo.work} minutos sem distrações. Depois de 4 sessões, uma pausa longa.</div>`}
  <p class="small muted" style="margin-top:14px">Dica: mantenha o app aberto durante a sessão. Se sair dele, o tempo continua contando e o aviso aparece quando você voltar.</p>`;
}
const mmss = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;

/* ============ Páginas do menu Mais ============ */
function barChart(vals, labels, { color = "var(--accent)", unit = "", hi = -1 } = {}) {
  const W = 320, H = 150, n = vals.length, bw = (W - 20) / n;
  const mx = Math.max(1, ...vals);
  let g = `<line x1="0" y1="118" x2="${W}" y2="118" stroke="var(--line)"/>`;
  vals.forEach((v, i) => {
    const h = (v / mx) * 92; const x = 10 + i * bw + bw * 0.18; const w = bw * 0.64;
    g += `<rect class="br" style="--i:${i}" x="${x.toFixed(1)}" y="${(118 - Math.max(h, 2)).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 2).toFixed(1)}" rx="6" fill="${color}" opacity="${i === hi || hi < 0 ? 1 : .5}"/>`;
    if (v) g += `<text x="${(x + w / 2).toFixed(1)}" y="${(112 - h).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${v}${unit}</text>`;
    g += `<text x="${(x + w / 2).toFixed(1)}" y="136" text-anchor="middle" font-size="11" fill="var(--muted)">${labels[i]}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function lastDays(n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(addDays(today(), -i)); return out; }

/* ============ Animações ============ */
const RM = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
const fxQ = [];
function afterRender(fn) { fxQ.push(fn); }
function runFx() { while (fxQ.length) { try { fxQ.shift()(); } catch (e) {} } }

/* Tarefas deslizando para o novo lugar (técnica FLIP) */
let flipT;
function flipRender() {
  clearTimeout(flipT);
  if (RM()) return render();
  const first = {};
  document.querySelectorAll("#view [data-fid]").forEach(el => { first[el.dataset.fid] = el.getBoundingClientRect().top; });
  render();
  document.querySelectorAll("#view [data-fid]").forEach(el => {
    const f = first[el.dataset.fid];
    if (f == null) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260 }); return; }
    const dy = f - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 1) return;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
}

/* +XP subindo do ponto tocado */
function floatXP(src, text) {
  if (RM()) return toast(text);
  let x = innerWidth / 2, y = innerHeight / 2;
  if (src && src.getBoundingClientRect) { const r = src.getBoundingClientRect(); if (r.width) { x = r.left + r.width / 2; y = r.top; } }
  const d = document.createElement("div");
  d.className = "xpf"; d.textContent = text;
  d.style.left = clamp(x, 40, innerWidth - 40) + "px"; d.style.top = y + "px";
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1200);
}

/* Confete de folhas */
function confetti(n = 48) {
  if (RM()) return;
  const wrap = document.createElement("div"); wrap.className = "confetti"; wrap.setAttribute("aria-hidden", "true");
  const cols = ["#2F5D50", "#3F7A68", "#4E8A74", "#9E8B5A", "#C9B888"];
  for (let i = 0; i < n; i++) {
    const leaf = document.createElement("i"); const s = 8 + Math.random() * 10;
    leaf.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${(s * 1.5).toFixed(1)}px;background:${cols[i % cols.length]};--dx:${((Math.random() - .5) * 180).toFixed(0)}px;--r:${(Math.random() * 900 - 450).toFixed(0)}deg;animation-duration:${(2.3 + Math.random() * 1.6).toFixed(2)}s;animation-delay:${(Math.random() * .6).toFixed(2)}s`;
    wrap.appendChild(leaf);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 4800);
}

/* Números contando */
function countUp(el, to, suffix = "", dur = 850) {
  if (RM() || !to) { el.textContent = to + suffix; return; }
  const t0 = performance.now(); const dec = to % 1 ? 1 : 0;
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - p, 3);
    el.textContent = (to * e).toFixed(dec) + suffix;
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* Arco do dia se desenhando na abertura */
let arcIntroDone = false;
function animateArc() {
  if (RM()) return;
  const el = $("#arcEl"), g = $("#sunGlow"), s = $("#sunDot"); if (!s || !el) return;
  const target = nowH(); if (target <= ARC.H0) return;
  const mks = [...document.querySelectorAll(".hero .mk")]; mks.forEach(m => m.style.opacity = 0);
  const bn = $("#bigN"); const to = bn ? +bn.textContent : 0;
  const set = h => { const [x, y] = arcPt(h); el.setAttribute("d", arcD(x, y)); [g, s].forEach(c => { c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); }); };
  set(ARC.H0 + 0.02); if (bn) bn.textContent = 0;
  const dur = 1500, t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - p, 3);
    const h = ARC.H0 + 0.02 + (target - ARC.H0 - 0.02) * e; set(h);
    mks.forEach(m => { if (+m.dataset.h <= h + 0.01) m.style.opacity = 1; });
    if (bn) bn.textContent = Math.round(to * e);
    if (p < 1) requestAnimationFrame(step); else mks.forEach(m => m.style.opacity = 1);
  })(t0);
}

/* Janelas de celebração (uma de cada vez) */
const ovQ = []; let ovOpen = false;
function showOverlay(html) { ovQ.push(html); if (!ovOpen) nextOverlay(); }
function nextOverlay() {
  const html = ovQ.shift(); if (!html) { ovOpen = false; return; }
  ovOpen = true;
  const el = document.createElement("div"); el.className = "ov";
  el.innerHTML = `<div class="ov-card" role="dialog" aria-modal="true">${html}<button class="btn primary block ov-close">Que bom!</button></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  const btn = el.querySelector(".ov-close"); setTimeout(() => btn.focus({ preventScroll: true }), 300);
  const close = () => { el.classList.remove("in"); el.classList.add("out"); setTimeout(() => { el.remove(); nextOverlay(); }, RM() ? 0 : 240); };
  el.addEventListener("click", e => { if (e.target === el || e.target.closest(".ov-close")) close(); });
}

/* ============ Timer de foco ============ */
const TK = "ritmo.timer";
function modeLen(m) { const p = S.settings.pomo; return Math.max(1, +(m === "work" ? p.work : m === "short" ? p.short : p.long) || 1) * 60; }
let T = (() => { try { const t = JSON.parse(localStorage.getItem(TK)); if (t && t.mode) return t; } catch (e) {} return null; })() || { mode: "work", running: false, endAt: 0, left: modeLen("work"), taskId: "", cycles: 0 };
function saveTimer() { try { localStorage.setItem(TK, JSON.stringify(T)); } catch (e) {} }
function timeLeft() { return T.running ? Math.max(0, Math.round((T.endAt - Date.now()) / 1000)) : T.left; }
function finishTimer() {
  const was = T.mode; T.running = false; beep(); vibrate([250, 120, 250]);
  if (was === "work") {
    S.focus.push({ id: uid(), taskId: T.taskId || "", min: +S.settings.pomo.work, date: today(), at: Date.now() });
    T.cycles = (T.cycles || 0) + 1; T.mode = T.cycles % 4 === 0 ? "long" : "short";
    save(); toast(`Sessão concluída! Hora de uma pausa ${T.mode === "long" ? "longa" : "curta"}.`);
    afterRender(() => { const tm = $(".timer"); if (tm) { tm.classList.add("finish"); floatXP($(".timer .tx"), "+15 XP"); } else floatXP(null, "+15 XP"); });
  } else { T.mode = "work"; toast("Pausa encerrada. Pronto para mais uma?"); }
  T.left = modeLen(T.mode); saveTimer(); render();
}
function updateFocusTab() {
  const el = $("#focus-tab"); if (!el) return;
  el.textContent = T.running ? mmss(timeLeft()) : "Foco";
}
setInterval(() => {
  if (!T.running) return;
  const l = timeLeft();
  if (l <= 0) return finishTimer();
  updateFocusTab();
  const ft = $("#ft"); if (ft) { ft.textContent = mmss(l); const r = $("#fring"); if (r) { const C = 2 * Math.PI * 130; r.setAttribute("stroke-dashoffset", (C * (1 - l / modeLen(T.mode))).toFixed(1)); } }
}, 1000);

function sheetReview() {

  if (step === 0) {
    const done = S.tasks.filter(t => t.done && t.doneAt && inWeek(dkey(new Date(t.doneAt)))).length;
    const fm = S.focus.filter(f => inWeek(f.date)).reduce((a, f) => a + f.min, 0);
    let hd = 0, hdue = 0; for (let k = ws; k <= we && k <= today(); k = addDays(k, 1)) S.habits.forEach(h => { if (habitDue(h, k) && k >= (h.createdAt || "0")) { hdue++; if (h.log[k]) hd++; } });
    return `${dots}<h2>Sua semana em números</h2><p class="small muted" style="margin-top:-8px">${fmtShort(ws)} a ${fmtShort(we)}</p>
    <div class="stat-grid"><div class="stat"><b>${done}</b><span>tarefas concluídas</span></div><div class="stat"><b>${fm}</b><span>minutos de foco</span></div><div class="stat"><b>${hdue ? Math.round(hd / hdue * 100) : 0}%</b><span>dos hábitos</span></div><div class="stat"><b>${Object.keys(S.journal).filter(k => inWeek(k) && S.journal[k]).length}</b><span>linhas no diário</span></div></div>

  }
  if (step === 1) {
    const pend = S.tasks.filter(t => !t.done && t.date && t.date <= we);
    return `${dots}<h2>O que ficou pendente</h2><p class="small muted" style="margin-top:-8px">Decida o destino de cada uma. Sem culpa: replanejar faz parte.</p>

    <div class="actions"><button class="btn" data-a="rvGo" data-d="-1">Voltar</button><button class="btn primary" data-a="rvGo" data-d="1">Continuar</button></div>`;
  }
  if (step === 2) return `${dots}<h2>O que pode melhorar?</h2>
    <div class="field" style="margin-top:0"><label>O que foi difícil ou atrapalhou?</label><textarea data-bind="hard" placeholder="Sem julgamento, só observação.">${esc(D.hard || "")}</textarea></div>
    <div class="actions"><button class="btn" data-a="rvGo" data-d="-1">Voltar</button><button class="btn primary" data-a="rvGo" data-d="1">Continuar</button></div>`;
  return `${dots}<h2>Próxima semana</h2>
    <div class="field" style="margin-top:0"><label>Qual será o seu foco principal?</label><textarea data-bind="focus" placeholder="Uma ou duas coisas que, se acontecerem, a semana valeu.">${esc(D.focus || "")}</textarea></div>

/* ============ Ações ============ */
const A = {
  tab(d) {
    const order = ["hoje", "tarefas", "habitos", "foco", "mais"];
    const dir = order.indexOf(d.t) - order.indexOf(route.tab);
    route.anim = dir > 0 ? "slide-l" : dir < 0 || route.page ? "slide-r" : null;
    route.tab = d.t; route.page = null; closeSheet(); render(); scrollTo(0, 0);
  },
  page(d) { route.anim = "slide-l"; route.page = d.p; render(); scrollTo(0, 0); },
  back() { route.anim = "slide-r"; route.page = null; render(); scrollTo(0, 0); },
  closeSheet() { const wasRun = sheetFn === sheetRun; closeSheet(); if (wasRun) render(); },
  seg(d) { route.seg[d.tab] = d.s; render(); },
  goInbox() { route.tab = "tarefas"; route.page = null; route.seg.tarefas = "inbox"; render(); scrollTo(0, 0); },
  areaFilter(d) { route.areaFilter = d.id || null; render(); },

  /* captura */
  capture() { openSheet(sheetCapture); setTimeout(() => { const t = $("#capText"); t && t.focus(); }, 280); },
  capSave(d) {
    const txt = ($("#capText").value || "").trim(); if (!txt) return $("#capText").focus();
    if (d.m === "today") { S.tasks.push(newTaskObj({ title: txt })); toast("Tarefa criada para hoje"); }
    else { S.inbox.push({ id: uid(), text: txt, createdAt: Date.now() }); toast("Guardado na caixa de entrada"); }
    save(); closeSheet(); render();
  },
  inboxToday(d) { const i = S.inbox.find(x => x.id === d.id); if (!i) return; S.tasks.push(newTaskObj({ title: i.text })); S.inbox = S.inbox.filter(x => x.id !== d.id); S.stats.inboxProcessed++; save(); render(); toast("Virou tarefa de hoje"); },
  inboxToTask(d) { const i = S.inbox.find(x => x.id === d.id); if (!i) return; openTask(newTaskObj({ title: i.text, date: "" }), true, { fromInbox: i.id }); },
  inboxDel(d) { S.inbox = S.inbox.filter(x => x.id !== d.id); S.stats.inboxProcessed++; save(); render(); },

  /* tarefas */
  toggleTask(d, el) {
    const t = taskById(d.id); if (!t) return;
    t.done = !t.done; t.doneAt = t.done ? Date.now() : 0;
    save();
    if (t.done) {
      vibrate(12); floatXP(el, "+10 XP");
      const k = today(); const top = S.top3[k] || [];
      if (top.length === 3 && top.includes(t.id) && top.every(id => { const x = taskById(id); return x && x.done; })) {
        setTimeout(() => { confetti(); toast("As 3 prioridades de hoje estão feitas! 🎉"); }, 450);
      }
    }
    if (sheetFn) { refreshSheet(); render(); return; }
    if (t.done && !RM()) {
      const box = el.closest(".task, .slot"); if (box) box.classList.add("done");

function deviceId() {
  let id = null; try { id = localStorage.getItem("ritmo.device"); } catch (e) {}
  if (!id) {
    const a = new Uint8Array(18); crypto.getRandomValues(a);
    id = btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    try { localStorage.setItem("ritmo.device", id); } catch (e) {}
  }
  return id;
}
function b64ToU8(s) { const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function api(path, body) {
  const r = await fetch("/api/" + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.message || j.error || "Erro " + r.status); err.code = j.error; throw err; }
  return j;
}

/* ---- Lembretes que o servidor vai enviar ---- */
function atOf(k, hhmm) { const [h, m] = String(hhmm || "00:00").split(":").map(Number); const d = parseKey(k); d.setHours(h || 0, m || 0, 0, 0); return d.getTime(); }
function buildReminders() {
  const n = nset(); const now = Date.now(); const k0 = today(); const out = [];
  const add = (id, at, title, body, tag) => { if (at > now - 3 * 3600e3 && at < now + 14.5 * 864e5) out.push({ id, at, title, body, tag }); };
  if (n.tasks) S.tasks.forEach(t => {
    if (t.done || !t.date || !t.time) return;
    const at = atOf(t.date, t.time) - (+n.lead || 0) * 60000;
    const ar = t.area ? area(t.area).name : "";
    add(`t:${t.id}:${at}`, at, `⏰ ${t.title}`, n.lead ? `Começa em ${n.lead} minutos (${t.time}).` : `Está na hora${ar ? " (" + ar + ")" : ""}.`, "t" + t.id);
  });
  for (let i = 0; i < 14; i++) {
    const k = addDays(k0, i);
    if (n.daily) {
      const at = atOf(k, n.dailyAt);
      if (i === 0) {
        const pend = S.tasks.filter(t => !t.done && t.date && t.date <= k);
        const habs = S.habits.filter(h => habitDue(h, k) && !h.log[k]);
        if (pend.length || habs.length) {
          const parts = [];
          if (pend.length) parts.push(`${pend.length} ${pend.length === 1 ? "tarefa pendente" : "tarefas pendentes"}: ${pend.slice(0, 3).map(t => t.title).join(", ")}${pend.length > 3 ? "…" : ""}`);
          if (habs.length) parts.push(`${habs.length === 1 ? "Falta o hábito" : "Faltam os hábitos"} ${habs.slice(0, 3).map(h => h.emoji + " " + h.name).join(", ")}`);
          add(`d:${k}`, at, "📋 Como ficou o seu dia?", parts.join(". ") + ".", "daily");
        }
      } else add(`d:${k}`, at, "📋 Hora de conferir o dia", "Veja o que ficou pendente e marque o que você já fez.", "daily");
    }
    if (n.morning && !(S.checkins[k] || {}).am) {
      const top = S.top3[k];
      add(`m:${k}`, atOf(k, n.morningAt), "🌤️ Bom dia!", top && top.length ? "Como você acordou? Faça o check-in da manhã." : "Faça o check-in e escolha as 3 prioridades de hoje.", "morning");
    }
    if (n.review && parseKey(k).getDay() === 0) {
      const wk = weekStart(k);
      if (!S.reviews.some(r => r.week === wk)) add(`r:${wk}`, atOf(k, n.reviewAt), "🪞 Revisão semanal", "5 minutos para fechar a semana e planejar a próxima.", "review");
    }
  }
  return out;
}
let syncT;
function scheduleSync() { if (!N.subscribed) return; clearTimeout(syncT); syncT = setTimeout(syncReminders, 2500); }
async function syncReminders() {
  if (!N.subscribed || !N.server || !N.server.ok) return;
  const payload = { deviceId: deviceId(), reminders: buildReminders() };
  try { await api("reminders", payload); N.err = ""; }
  catch (e) {
    if (e.code === "not_subscribed") {
      try { const sub = await N.reg.pushManager.getSubscription(); if (sub) { await api("subscribe", { deviceId: payload.deviceId, subscription: sub.toJSON() }); await api("reminders", payload); N.err = ""; } }
      catch (e2) { N.err = e2.message; }
    } else N.err = e.message;
  }
}

/* ---- Ligar, desligar, testar ---- */
async function initNotif() {
  if (!("serviceWorker" in navigator) || !window.isSecureContext) return;
  try { N.reg = await navigator.serviceWorker.register("/sw.js"); await navigator.serviceWorker.ready; } catch (e) { N.reg = null; return; }
  N.supported = "PushManager" in window && "Notification" in window;
  N.perm = N.supported ? Notification.permission : "unsupported";
  try { N.server = await api("config"); } catch (e) { N.server = { ok: false }; }
  if (N.supported) { try { const sub = await N.reg.pushManager.getSubscription(); N.subscribed = !!sub && N.perm === "granted" && nset().on; } catch (e) {} }
  if (N.subscribed) syncReminders();
  if (route.page === "ajustes") render();
}
const NA = {
  async notifOn() {
    if (N.busy) return;
    if (isIOS && !standalone()) return openSheet(sheetIOS);
    if (!N.supported) return toast("Este navegador não permite notificações.");
    if (!N.server || !N.server.ok) return toast("O servidor ainda não está configurado. Abra /api/setup.");
    N.busy = true; render();
    try {
      const perm = await Notification.requestPermission(); N.perm = perm;
      if (perm !== "granted") { toast("Permissão negada. Libere as notificações nos ajustes do celular."); return; }
      let sub = await N.reg.pushManager.getSubscription();
      if (!sub) sub = await N.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(N.server.publicKey) });
      await api("subscribe", { deviceId: deviceId(), subscription: sub.toJSON() });
      nset().on = true; N.subscribed = true; save(true);
      await syncReminders();
      toast("Notificações ativadas 🔔");
    } catch (e) { N.err = e.message; toast("Não deu para ativar: " + e.message); }
    finally { N.busy = false; render(); }
  },
  async notifOff() {
    try { const sub = await N.reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
    try { await api("unsubscribe", { deviceId: deviceId() }); } catch (e) {}
    nset().on = false; N.subscribed = false; save(true); render(); toast("Notificações desativadas");
  },
  async notifTest() {
    try { await syncReminders(); await api("test", { deviceId: deviceId() }); toast("Enviado! Deve chegar em alguns segundos."); }
    catch (e) { toast("Falhou: " + e.message); }
  },
  nFlip(d) { const n = nset(); n[d.k] = !n[d.k]; save(); render(); },
  nLead(d) { nset().lead = +d.v; save(); render(); }
};
Object.assign(A, NA);
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.nset) return;
  if (el.value) { nset()[el.dataset.nset] = el.value; save(); toast("Horário salvo"); }
});

function sheetIOS() {
  return `<h2>Primeiro, instale o Ritmo</h2>
  <p class="muted small" style="margin-top:-6px">No iPhone, a Apple só libera notificações para apps adicionados à tela de início.</p>
  <ol style="padding-left:20px;line-height:1.7"><li>Toque no botão <b>Compartilhar</b> do Safari (o quadrado com a seta para cima).</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li><li>Abra o Ritmo pelo ícone novo e volte aqui em Ajustes.</li></ol>
  <p class="small muted">Os dados do app instalado ficam separados dos do Safari. Se já usou o Ritmo no navegador, faça um backup aqui e restaure lá.</p>
  <div class="actions"><button class="btn primary" data-a="closeSheet">Entendi</button></div>`;
}

function notifSection() {
  if (!N.reg) return "";
  const n = nset(); const on = N.subscribed;
  let status;
  if (!N.server) status = "Verificando o servidor…";
  else if (!N.server.ok) status = `⚠️ O servidor ainda não está configurado. Abra <a href="/api/setup" target="_blank" rel="noopener" style="color:var(--accent-text);font-weight:700">/api/setup</a> para ver o que falta.`;
  else if (isIOS && !standalone()) status = "📲 No iPhone, adicione o Ritmo à tela de início e abra por lá para ativar.";
  else if (N.perm === "denied") status = "🔕 As notificações estão bloqueadas para este app nos ajustes do celular.";
  else status = on ? "🔔 Ativadas neste aparelho." : "🔕 Desativadas neste aparelho.";
  const row = (k, title, desc, extra) => `<button class="toggle" data-a="nFlip" data-k="${k}"><div><b>${title}</b><div class="small muted">${desc}</div></div><span class="sw ${n[k] ? "on" : ""}"></span></button>${n[k] && extra ? `<div style="padding:0 0 12px">${extra}</div>` : ""}`;
  const time = k => `<input type="time" data-nset="${k}" value="${n[k]}" aria-label="Horário" style="max-width:150px">`;
  return `<div class="sec"><h2>Notificações</h2></div><div class="card">
    <p class="small" style="margin:0 0 ${on ? 4 : 12}px">${status}${N.err ? `<br><span style="color:var(--danger)">${esc(N.err)}</span>` : ""}</p>
    ${on ? `
      ${row("tasks", "Tarefas com horário", "Avisa quando chega a hora de cada tarefa", `<div class="chips">${[[0, "Na hora"], [10, "10 min antes"], [30, "30 min antes"]].map(([v, l]) => `<button class="chip ${+n.lead === v ? "on" : ""}" data-a="nLead" data-v="${v}">${l}</button>`).join("")}</div>`)}
      ${row("daily", "Cobrança do dia", "Lista o que ficou pendente, tarefas e hábitos", time("dailyAt"))}
      ${row("morning", "Check-in da manhã", "Lembra de fazer o check-in e escolher as prioridades", time("morningAt"))}
      ${row("review", "Revisão de domingo", "Lembra da revisão semanal", time("reviewAt"))}
      <div class="actions"><button class="btn" data-a="notifTest">Enviar teste</button><button class="btn ghost" data-a="notifOff">Desativar</button></div>`
      : `<button class="btn primary block" data-a="notifOn" ${N.busy ? "disabled" : ""}>${N.busy ? "Ativando…" : "Ativar notificações"}</button>`}
  </div>`;
}

/* Sincroniza sempre que algo muda e quando o app volta a aparecer */
const _saveOrig = save;
save = function (quiet) { _saveOrig(quiet); scheduleSync(); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleSync(); });
setInterval(() => { if (document.visibilityState === "visible") syncReminders(); }, 10 * 60000);
initNotif();
</script>
</body></html>
